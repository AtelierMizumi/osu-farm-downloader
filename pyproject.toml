[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-farm-downloader"
version = "1.0.0"
description = "Smart Ranked Farm Maps Downloader for osu! stable on Linux and external drives"
readme = "README.md"
authors = [
  { name = "Minh Thuận Trần", email = "thuanc177@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment",
]
keywords = ["osu", "beatmap", "downloader", "mirror", "linux", "farm", "pyside6"]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
]

[project.scripts]
osu-dl = "osu_dl:main"
osu-dl-gui = "gui:main"
